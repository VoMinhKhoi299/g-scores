spring:
  application:
    name: g-scores-backend
  datasource:
    url: jdbc:postgresql://localhost:5433/gscores
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 1000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
