spring:
  application:
    name: g-scores-backend
  datasource:
    url: jdbc:postgresql://localhost:5433/gscores
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 1000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  dataset:
    path: ${DATASET_PATH:./dataset/diem_thi_thpt_2024.csv}
  cors:
    # Danh sach origin duoc phep goi API. Mac dinh "*" cho moi truong.
    # Tren Render: dat CORS_ALLOWED_ORIGINS=https://<static-site>.onrender.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
